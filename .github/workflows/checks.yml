name: Checks

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debounce:
    name: Wait for push burst to settle
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait 15 minutes after the latest push
        run: sleep 900

  build:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    needs: debounce
    if: ${{ always() && (needs.debounce.result == 'success' || needs.debounce.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["1.24.x", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./cmd/opencode2api

  format:
    name: Formatting and WebUI syntax
    needs: debounce
    if: ${{ always() && (needs.debounce.result == 'success' || needs.debounce.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - run: npm run format:check
      - run: npm run check:web
      - name: Check container entrypoint syntax
        run: sh -n docker-entrypoint.sh
